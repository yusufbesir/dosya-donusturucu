# TaaDön Rust çekirdeği (taa-donustur.exe): arşiv (zip/gzip) ve çıktı imza denetimi, JSON satırlı CLI.
# Sahip: Yusuf (TaaDön projesi). yazan: [Claude#taadon-rust-asama1 2026-11-04], ad değişikliği [Claude#taadon-rust-asama2 2026-11-04].
# Taşınabilir: mutlak yol/üst klasör bağımlılığı yok; ileride yusufbesir/taa-paket Cargo workspace üyesi olur
# (o zaman [profile.release] workspace köküne taşınmalı; üye crate profilleri yok sayılır). Modül bilgisi: modul.toml.
# Değişiklik: Yusuf'un kuralları (ORTAK-AJAN-KURALLARI.md) çerçevesinde; bağımlılık eklemek Yusuf'a sorularak.
[package]
name = "taa-donustur"
version = "1.6.0"
edition = "2021"
publish = false
description = "TaaDön ağır iş çekirdeği: güvenli zip/gzip ve imza denetimi"

[lib]
name = "taa_donustur"
path = "src/lib.rs"

[[bin]]
name = "taa-donustur"
path = "src/main.rs"

[dependencies]
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
