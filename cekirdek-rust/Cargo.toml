# TaaDön Rust çekirdeği (taadon-cekirdek.exe): arşiv (zip/gzip) ve çıktı imza denetimi, JSON satırlı CLI.
# Sahip: Yusuf (TaaDön projesi). yazan: [Claude#taadon-rust-asama1 2026-11-04].
# Değişiklik: Yusuf'un kuralları (ORTAK-AJAN-KURALLARI.md) çerçevesinde; bağımlılık eklemek Yusuf'a sorularak.
[package]
name = "taadon-cekirdek"
version = "0.1.0"
edition = "2021"
publish = false
description = "TaaDön ağır iş çekirdeği: güvenli zip/gzip ve imza denetimi"

[lib]
name = "taadon_cekirdek"
path = "src/lib.rs"

[[bin]]
name = "taadon-cekirdek"
path = "src/main.rs"

[dependencies]
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
